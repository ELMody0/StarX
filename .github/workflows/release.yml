name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set version from tag
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          if ($ver -notmatch '^\d+\.\d+\.\d+$') { throw "Bad tag: ${{ github.ref_name }}" }
          $ver | Out-File -FilePath VERSION -Encoding ascii -NoNewline
          "APP_VERSION=$ver" >> $env:GITHUB_ENV

      - name: Build NativeBridge (C++)
        shell: pwsh
        run: g++ -shared -O2 -o NativeBridge.dll NativeBridge.cpp

      - name: Build StarX (C#)
        run: dotnet publish StarX_Client/StarX_Client.csproj -c Release -r win-x64 --self-contained false -o publish/app

      - name: Build StarXUpdater (C#)
        run: dotnet publish StarXUpdater/StarXUpdater.csproj -c Release -r win-x64 --self-contained false -o publish/updater

      - name: Stage package
        shell: pwsh
        run: |
          $stage = "stage/StarX-v$env:APP_VERSION"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item publish/app/* "$stage/" -Recurse -Force -Exclude *.pdb
          Copy-Item publish/updater/StarXUpdater.exe, publish/updater/StarXUpdater.dll "$stage/" -Force
          Copy-Item NativeBridge.dll "$stage/" -Force
          if (Test-Path app_icon.ico) { Copy-Item app_icon.ico "$stage/" -Force }

      - name: Create ZIP + SHA-256
        shell: pwsh
        run: |
          $zip = "StarX-v$env:APP_VERSION.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "stage/StarX-v$env:APP_VERSION/*" -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -FilePath "$zip.sha256" -Encoding ascii -NoNewline
          "ASSET_ZIP=$zip" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET_ZIP }}
            ${{ env.ASSET_ZIP }}.sha256
          fail_on_unmatched_files: true
